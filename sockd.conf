# Log once to stdout; setting errorlog separately would duplicate errors.
logoutput: stdout

internal: 0.0.0.0 port = 8222
external: tun0

# Drop privileges after startup.
user.notprivileged: proxyuser

clientmethod: none
socksmethod: none

client pass {
        from: 0.0.0.0/0 to: 0.0.0.0/0
        log: error connect disconnect
}

socks pass {
        from: 0.0.0.0/0 to: 0.0.0.0/0
        log: error connect disconnect
}
